---
- name: Check whether firewalld is active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - firewalld
  register: firewall_service_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install and start firewalld
  when: firewall_manage | bool
  block:
    - name: Install the firewalld package
      ansible.builtin.dnf:
        name: "{{ firewall_packages }}"
        state: present

    - name: Enable and start firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        state: started
        enabled: true

    - name: Wait until the firewalld API is ready
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --state
      register: firewall_api_wait
      until: firewall_api_wait.stdout | trim == "running"
      retries: 10
      delay: 2
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

- name: Configure firewalld zones for Swarm traffic
  when:
    - firewall_manage | bool
    - not (ansible_check_mode and firewall_service_check.stdout | trim != "active")
  block:
    - name: Require the private Swarm interface for multi-node clusters
      ansible.builtin.assert:
        that:
          - firewall_swarm_interface | length > 0
        fail_msg: >-
          swarm_role={{ swarm_role | default('init') }} joins an existing
          cluster, so firewall_swarm_interface must name the private-network
          interface shared with the other nodes. Leaving it empty is supported
          only for single-node clusters, where Swarm traffic stays on the
          loopback interface. Set the interface, or set firewall_manage: false
          to manage these rules outside this playbook.
      when: swarm_role | default('init') in ['join_manager', 'join_worker']

    - name: Allow SSH in the public zone
      ansible.posix.firewalld:
        service: ssh
        zone: "{{ firewall_public_zone }}"
        permanent: true
        immediate: true
        state: enabled
      when: firewall_allow_ssh | bool

    - name: Assign the private interface to the Swarm zone
      ansible.posix.firewalld:
        interface: "{{ firewall_swarm_interface }}"
        zone: "{{ firewall_swarm_zone }}"
        permanent: true
        immediate: true
        state: enabled
      when: firewall_swarm_interface | length > 0

    - name: Enable Swarm ports in the private zone
      ansible.posix.firewalld:
        port: "{{ item }}"
        zone: "{{ firewall_swarm_zone }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ firewall_swarm_ports }}"
      when: firewall_swarm_interface | length > 0

    - name: Enable published ports in the public zone
      ansible.posix.firewalld:
        port: "{{ item }}"
        zone: "{{ firewall_public_zone }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ firewall_extra_ports }}"

    - name: Note the single-node firewall mode
      ansible.builtin.debug:
        msg: >-
          firewall_swarm_interface is empty: this single-node cluster keeps
          Swarm ports ({{ firewall_swarm_ports | join(', ') }}) local-only -
          firewalld accepts loopback traffic unconditionally - and opens only
          the published ports in the public zone. Set firewall_swarm_interface
          before adding a second node.
      when: firewall_swarm_interface | length == 0

- name: Recheck firewalld state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - firewalld
  register: firewall_service_final
  changed_when: false
  failed_when: false
  check_mode: false

- name: Warn when firewalld is active but unmanaged
  ansible.builtin.debug:
    msg: >-
      firewalld is active and firewall_manage is false. Ensure Swarm ports
      {{ firewall_swarm_ports | join(', ') }} are restricted to the private
      network, and published ports {{ firewall_extra_ports | join(', ') }} are
      configured in the appropriate public zone.
  when:
    - not (firewall_manage | bool)
    - firewall_service_final.stdout | trim == "active"

- name: Warn when firewalld protection is not applied
  ansible.builtin.debug:
    msg: >-
      firewalld is not active (status:
      '{{ firewall_service_final.stdout | trim }}'). This playbook did not apply
      firewall rules. Restrict Swarm ports
      {{ firewall_swarm_ports | join(', ') }} to the private network - or keep
      them local-only on a single-node cluster - outside this playbook.
  when: firewall_service_final.stdout | trim != "active"
