services:
  app:
    image: traefik/whoami:v1.12
    environment:
      - "TZ=${TIMEZONE:-UTC}"
    networks:
      - internal
      - public
    deploy:
      mode: replicated
      replicas: 1
      resources:
        reservations:
          memory: 8M
        limits:
          memory: 32M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=public"
        - "traefik.http.routers.app.rule=Host(`app.${ROOT_DOMAIN}`)"
        - "traefik.http.routers.app.entrypoints=https"
        - "traefik.http.routers.app.tls.certresolver=cloudflare"
        - "traefik.http.services.app.loadbalancer.server.port=80"

networks:
  internal:
    external: true
  public:
    external: true
